<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe7f0">
<title>光線特勤隊・積木島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{--ink:#1f2b3a;--sub:#6a7888;--line:#e3e9f0;--accent:#3ea8ff;
    --disp:'Fredoka','Noto Sans TC',system-ui,sans-serif;--body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(90% 70% at 40% 40%,#eef3f8 0%,#dbe4ee 55%,#c9d5e2 100%)}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}

  /* 左上品牌、右上大門 */
  .corner{position:fixed;top:20px;z-index:20;display:flex;align-items:center;gap:10px}
  .corner.l{left:24px}.corner.r{right:24px}
  .logo{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--ink)}
  .logo span{color:var(--sub);font-weight:600;margin-left:6px}
  .pill{font-weight:900;font-size:13px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(31,43,58,.08)}

  /* 島的標題（像影片那樣放在島上方） */
  .title{position:fixed;left:var(--cx,50%);top:13vh;transform:translateX(-50%);z-index:12;text-align:center;pointer-events:none;transition:opacity .35s,transform .45s}
  .title.swap{opacity:0;transform:translateX(-50%) translateY(10px)}
  .title .tag{display:inline-block;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.22em;color:#fff;background:var(--c,#3ea8ff);border-radius:999px;padding:5px 16px 5px 19px;box-shadow:0 6px 16px rgba(31,43,58,.15)}
  .title h1{margin:12px 0 4px;font-size:clamp(34px,4.4vw,56px);font-weight:900;letter-spacing:.08em;line-height:1.1}
  .title p{margin:0;font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.06em}

  /* 下方：六座島的切換列 */
  .dock{position:fixed;left:var(--cx,50%);bottom:26px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border-radius:999px;padding:6px;box-shadow:0 8px 24px rgba(31,43,58,.12)}
  .dock button{border:none;background:transparent;cursor:pointer;font-family:var(--body)}
  .dot{position:relative;width:40px;height:40px;border-radius:50%;font-family:var(--disp)!important;font-weight:700;font-size:15px;color:var(--sub);transition:all .25s}
  .dot.done::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#2fb36e}
  .dot.on{width:auto;padding:0 16px;color:#fff;background:var(--c)}
  .dot.on small{font-family:var(--body);font-weight:900;font-size:13px;margin-left:6px}
  .dot:not(.on) small{display:none}
  .arr{width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--ink)}
  .arr:hover,.dot:not(.on):hover{background:rgba(31,43,58,.06)}

  /* 右側課程卡 */
  #panel{position:fixed;right:24px;top:72px;width:360px;max-height:calc(100vh - 96px);overflow:auto;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-radius:22px;box-shadow:0 18px 44px rgba(31,43,58,.14);padding:18px}
  .dh{display:flex;align-items:center;gap:6px}
  .dh button{border:none;background:#f1f5f9;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink)}
  .dh button:disabled{opacity:.3;cursor:default}
  .dh .d{flex:1;text-align:center}
  .dh .d b{display:block;font-family:var(--disp);font-size:22px;font-weight:700}
  .dh .d span{font-size:12px;font-weight:900;color:var(--sub);letter-spacing:.08em}
  .dh .d span.today{color:#e8590c}
  .slot{margin-top:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px}
  .row{display:flex;align-items:center;gap:8px}
  .cls{flex:none;font-weight:900;font-size:12px;color:#fff;background:#ff8a3c;border-radius:6px;padding:3px 8px}
  .cls.b{background:#25b9a3}
  .per{font-size:12.5px;font-weight:800;color:var(--sub)}
  .ln{margin:6px 0 10px;font-size:17px;font-weight:900;line-height:1.35}
  .start{width:100%;border:none;cursor:pointer;font-family:var(--body);font-weight:900;font-size:17px;color:#fff;border-radius:12px;padding:12px;background:var(--c,#3ea8ff);box-shadow:0 6px 14px rgba(31,43,58,.15);transition:transform .1s,filter .2s}
  .start:hover{filter:brightness(1.05)}.start:active{transform:translateY(1px)}
  details{margin-top:8px}summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--sub);list-style:none}
  summary::-webkit-details-marker{display:none}summary::before{content:"＋ "}details[open] summary::before{content:"－ "}
  .tip{margin-top:8px;font-size:13px;font-weight:700;color:#6b5512;background:#fff7dd;border-radius:10px;padding:8px 10px;line-height:1.6}
  .prep label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px;padding:3px 0}
  .prep input{width:17px;height:17px;accent-color:var(--c,#3ea8ff)}
  .prep label.done{opacity:.45;text-decoration:line-through}
  .steps{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .steps a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-weight:700;font-size:13px;background:#f5f8fb;border-radius:9px;padding:7px 9px}
  .steps a i{flex:none;font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
  .list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .list button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer;font-family:var(--body);color:var(--ink)}
  .list button b{font-family:var(--disp);font-size:15px;min-width:42px}
  .list button span{flex:1;font-weight:800;font-size:13.5px}
  .list button em{font-style:normal;font-size:12px;font-weight:900;color:var(--sub)}
  .list button.past{opacity:.5}
  .empty{margin-top:12px;font-weight:800;font-size:14px;color:var(--sub);line-height:1.6}
  .more{display:flex;gap:8px;margin-top:14px}
  .more a{flex:1;text-align:center;font-weight:900;font-size:13px;text-decoration:none;color:var(--ink);background:#f1f5f9;border-radius:12px;padding:10px 8px}
  .hint{position:fixed;left:var(--cx,50%);bottom:84px;transform:translateX(-50%);z-index:11;font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.08em;transition:opacity 1s;pointer-events:none}
  .fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:900;z-index:30;background:#eef3f8}

  @media (max-width:820px){
    body{overflow:auto}
    #stage{position:relative;height:58vh}
    .corner{position:absolute;top:14px}.corner.l{left:16px}.corner.r{right:16px}
    .title{position:absolute;top:58px;left:50%}
    .title h1{font-size:30px;margin:8px 0 2px}.title p{font-size:13px}
    .dock{position:absolute;top:calc(58vh - 64px);bottom:auto;left:50%}
    .dot{width:34px;height:34px;font-size:14px}.dot.on{padding:0 14px}.dot.on small{display:none}.arr{display:none}
    #panel{position:relative;right:auto;top:auto;width:auto;max-height:none;margin:10px 12px 100px}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="corner l"><div class="logo">光線特勤隊<span>積木島</span></div></div>
<div class="corner r"><a class="pill" href="https://classtools1020.github.io/">✦ 大門</a><a class="pill" href="/light/">列表版</a></div>
<div class="title" id="title"><span class="tag" id="ttag"></span><h1 id="th"></h1><p id="tp"></p></div>
<nav class="dock" id="dock" aria-label="選擇任務島"></nav>
<div class="hint" id="hint">拖曳可以轉動積木島</div>
<aside id="panel" aria-live="polite"></aside>
<div class="fallback" id="fallback"><div>這台電腦不支援 3D 畫面<br><br><a href="/light/">👉 改用列表版主選單</a></div></div>

<script src="data.js"></script>
<script src="https://classtools1020.github.io/games/fx.js"></script>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const {LESSONS,SCHED}=window.LIGHT;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 任務 ---------- */
const TASKS=[
  {id:1,k:'一',tag:'任務一',name:'光與影子',desc:'光源・光走直線・影子現形',url:'https://classtools1020.github.io/light-shadow/',c:'#f2b631'},
  {id:2,k:'二',tag:'任務二',name:'光的反射',desc:'反射定律・鏡面和漫反射',url:'https://classtools1020.github.io/light-reflection/',c:'#22b5a0'},
  {id:3,k:'三',tag:'任務三',name:'光與顏色',desc:'色散・選擇性反射・加色混合',url:'https://classtools1020.github.io/light-color/',c:'#ec5f9c'},
  {id:6,k:'月',tag:'特別篇',name:'中秋月光',desc:'月亮會自己發光嗎？',url:'https://classtools1020.github.io/moon/',c:'#8b7fd6'},
  {id:4,k:'四',tag:'任務四',name:'光的折射',desc:'吸管真的斷了嗎？',url:'https://classtools1020.github.io/light-refract/',c:'#3a9cf0'},
  {id:5,k:'五',tag:'任務五',name:'透鏡',desc:'放大鏡只會把東西變大嗎？',url:'https://classtools1020.github.io/light-lens/',c:'#f08a24'}
];
const taskOf=l=>/^[ABC]$|^REV$/.test(l)?3:/^R/.test(l)?4:/^L/.test(l)?5:l==='M'?6:3;
const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
const dates=[...new Set(SCHED.map(s=>s.d))].sort();
const WD=['日','一','二','三','四','五','六'];
const fmt=d=>{const [,m,dd]=d.split('-');return {md:`${+m}/${+dd}`,wd:'週'+WD[new Date(d+'T12:00:00+08:00').getDay()]};};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
TASKS.forEach(t=>{const ds=SCHED.filter(s=>taskOf(s.l)===t.id).map(s=>s.d);t.done=ds.length&&ds.every(d=>d<today);});

/* ---------- 3D ---------- */
const stage=document.getElementById('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){document.getElementById('fallback').style.display='flex';throw e;}
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,.1,400);
scene.add(new THREE.HemisphereLight(0xffffff,0xc4cfdc,1.25));
const key=new THREE.DirectionalLight(0xffffff,2.0);key.position.set(-14,26,18);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:80});key.shadow.bias=-.0005;key.shadow.radius=6;
scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0xdfe9ff,.7);rim.position.set(16,10,-14);scene.add(rim);

const cache={};
function mat(hex,o){const k=hex+JSON.stringify(o||{});return cache[k]||(cache[k]=new THREE.MeshPhysicalMaterial(Object.assign({color:hex,roughness:.42,clearcoat:.25,clearcoatRoughness:.5},o||{})));}
const studGeo=new THREE.CylinderGeometry(.3,.3,.2,24);
function box(w,h,d,c,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,o));m.castShadow=m.receiveShadow=true;return m;}
function studs(w,d,y,c,parent){const n=w*d,im=new THREE.InstancedMesh(studGeo,mat(c),n);const M=new THREE.Matrix4();let k=0;
  for(let i=0;i<w;i++)for(let j=0;j<d;j++){M.makeTranslation(-w/2+.5+i,y,-d/2+.5+j);im.setMatrixAt(k++,M);}im.castShadow=im.receiveShadow=true;parent.add(im);}
function brick(w,h,d,c,parent,x,y,z){const g=new THREE.Group();const b=box(w,h,d,c);b.position.y=h/2;g.add(b);studs(w,d,h+.1,c,g);g.position.set(x||0,y||0,z||0);parent.add(g);return g;}
function tree(parent,x,z,s){const g=new THREE.Group();const tr=box(.4,.8,.4,'#8a5a32');tr.position.y=.4;g.add(tr);
  [[1.4,1.2,1.1],[1.05,1.05,1.9],[.65,.9,2.6]].forEach(([r,h,y])=>{const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,10),mat('#6cbf5a'));c.position.y=y;c.castShadow=true;g.add(c);});
  g.position.set(x,0,z);g.scale.setScalar(s);parent.add(g);}
const glass=o=>mat('#ffffff',Object.assign({transmission:.92,thickness:.4,roughness:.04,ior:1.45,transparent:true,opacity:.55,clearcoat:1},o||{}));

/* 每座島：同一套配色（綠底板＋咖啡土＋灰吊塊），只有道具換主題 */
const SP=72,PW=10,PD=8;
let islands;function buildIslands(){islands=TASKS.map((t,i)=>{
  const g=new THREE.Group();g.position.set(i*SP,0,0);
  const soil=box(PW,1,PD,'#9a6a3c');soil.position.y=-.5;g.add(soil);
  const plate=box(PW,.4,PD,'#78c25f');plate.position.y=.2;g.add(plate);
  studs(PW,PD,.5,'#78c25f',g);
  [[PW-2,.8,PD-2,'#b6bec8',-1.4],[PW-4,.7,PD-4,'#9aa3ad',-2.15],[PW-7,.6,PD-6,'#828b95',-2.8]].forEach(([w,h,d,c,y])=>{const b=box(w,h,d,c);b.position.y=y;g.add(b);});
  const top=new THREE.Group();top.position.y=.6;g.add(top);
  PROPS[t.id](top,t.c);
  scene.add(g);return {t,g};});}

/* 道具（每座島一個清楚的主角，配一兩棵樹就好） */
const PROPS={
  1(g,c){const post=box(.4,3.6,.4,'#5d6773');post.position.set(-1.8,1.8,-1.2);g.add(post);
    const arm=box(1.4,.3,.3,'#5d6773');arm.position.set(-1.3,3.5,-1.2);g.add(arm);
    const lamp=box(.8,.5,.8,'#fff4c2',{emissive:'#ffd35a',emissiveIntensity:1.8});lamp.position.set(-.8,3.2,-1.2);g.add(lamp);
    const pl=new THREE.PointLight(0xffd27a,14,8,2);pl.position.set(-.8,2.9,-1.2);g.add(pl);
    brick(1,1,1,c,g,.6,0,.4);brick(1,1,1,c,g,.6,1.2,.4);
    tree(g,3.2,-2.2,.75);},
  2(g,c){const pond=box(4.2,.12,3,'#9fd6f5',{roughness:.03,clearcoat:1,metalness:.15});pond.position.set(-1.2,.06,.8);g.add(pond);
    const fr=box(2.8,3.2,.36,c);fr.position.set(1.8,1.6,-1.8);g.add(fr);
    const mir=box(2.2,2.6,.05,'#eef4fa',{roughness:.02,metalness:1});mir.position.set(1.8,1.6,-1.6);g.add(mir);
    tree(g,-3.4,-2.3,.7);},
  3(g,c){const pr=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,2.6,3),mat('#dff1ff',{transmission:.35,roughness:.08,thickness:1,ior:1.5,transparent:true,opacity:.92,clearcoat:1}));pr.rotation.set(0,.5,Math.PI/2);pr.position.set(-1.4,1.3,-.4);pr.castShadow=true;g.add(pr);
    ['#e84a4a','#f08a24','#f2c531','#4cbf5a','#3a9cf0','#5b4fd6','#a457e6'].forEach((cc,i)=>{const s=box(.5,.08,2.6-i*.12,cc);s.position.set(.5+i*.5,.04,.4+i*.18);s.rotation.y=-.35;g.add(s);});
    tree(g,3.4,-2.3,.7);},
  6(g,c){const m=new THREE.Mesh(new THREE.SphereGeometry(1.6,48,32),mat('#f6efd0',{emissive:'#f1dc96',emissiveIntensity:.35,roughness:.85,clearcoat:0}));m.position.set(-.6,2.1,-.4);m.castShadow=true;g.add(m);
    const pom=new THREE.Mesh(new THREE.SphereGeometry(.7,32,20),mat('#b8d25a'));pom.position.set(1.9,.7,1.4);pom.castShadow=true;g.add(pom);
    tree(g,3.4,-2.3,.65);},
  4(g,c){const cup=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.1,3.2,40,1,true),glass({side:THREE.DoubleSide}));cup.position.set(-1,1.6,0);g.add(cup);
    const base=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.12,40),glass());base.position.set(-1,.06,0);g.add(base);
    const water=new THREE.Mesh(new THREE.CylinderGeometry(1.18,1.1,1.9,40),mat('#8fd0ff',{transmission:.5,roughness:.05,transparent:true,opacity:.7}));water.position.set(-1,1.0,0);g.add(water);
    const st=mat('#f2679a');const up=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,2.6,14),st);up.position.set(-.5,2.75,.1);up.rotation.z=-.45;g.add(up);
    const dn=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,1.9,14),st);dn.position.set(-1.05,1.15,.1);dn.rotation.z=-.7;g.add(dn);
    tree(g,3.3,-2.3,.75);},
  5(g,c){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.5,.2,18,56),mat('#c9a14a',{metalness:.75,roughness:.28}));ring.position.set(-.8,2.4,0);ring.rotation.y=.55;ring.castShadow=true;g.add(ring);
    const lens=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.45,.14,48),glass({opacity:.5}));lens.rotation.set(Math.PI/2,0,.55);lens.position.copy(ring.position);g.add(lens);
    const h=box(.34,2.3,.34,'#6b3d1f');h.position.set(.25,.95,.55);h.rotation.z=-.5;g.add(h);
    brick(3,.4,2,'#f4ead2',g,1.9,0,1.8);
    tree(g,-3.4,2.3,.65);}
};

/* 光光積木小人 */
const koko=new THREE.Group();
{const head=box(1,1,1,'#ffd23f');head.position.y=2.35;koko.add(head);
  [-.22,.22].forEach(x=>{const e=box(.13,.2,.04,'#1f2b3a');e.position.set(x,2.42,.51);koko.add(e);});
  const sm=box(.34,.06,.04,'#1f2b3a');sm.position.set(0,2.15,.51);koko.add(sm);
  const body=box(1.1,1,.7,'#3a9cf0');body.position.y=1.35;koko.add(body);
  [-.28,.28].forEach(x=>{const l=box(.48,.85,.62,'#1f2b3a');l.position.set(x,.42,0);koko.add(l);});}
koko.scale.setScalar(.8);
buildIslands();

/* ---------- 鏡頭：一次只看一座島 ---------- */
let cur=0,camX=0,spin=0,spinV=0,drag=false,lx=0,auto=true;
const tEl=document.getElementById('title');
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);
  const wide=innerWidth>820,offX=wide?document.getElementById('panel').offsetWidth+24:0;
  camera.aspect=(r.width+offX)/r.height;camera.setViewOffset(r.width+offX,r.height,offX,0,r.width,r.height);camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--cx',wide?((r.width-offX)/2)+'px':'50%');}
addEventListener('resize',resize);
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;auto=false;lx=e.clientX;cv.setPointerCapture(e.pointerId);document.getElementById('hint').style.opacity=0;});
cv.addEventListener('pointermove',e=>{if(!drag)return;spinV=(e.clientX-lx)*.006;spin+=spinV;lx=e.clientX;});
cv.addEventListener('pointerup',()=>{drag=false;setTimeout(()=>auto=true,4000);});

/* ---------- 介面 ---------- */
const dock=document.getElementById('dock'),panel=document.getElementById('panel');
dock.innerHTML=`<button class="arr" id="prev" aria-label="上一座島">‹</button>`+TASKS.map((t,i)=>`<button class="dot${t.done?' done':''}" data-i="${i}" style="--c:${t.c}">${t.k}<small>${t.name}</small></button>`).join('')+`<button class="arr" id="next" aria-label="下一座島">›</button>`;
dock.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));
document.getElementById('prev').onclick=()=>go(Math.max(0,cur-1));
document.getElementById('next').onclick=()=>go(Math.min(TASKS.length-1,cur+1));
let curDate=null;
function go(i,date){cur=i;const t=TASKS[i];spin=0;
  tEl.classList.add('swap');setTimeout(()=>{document.getElementById('ttag').textContent=t.tag;document.getElementById('th').textContent=t.name;document.getElementById('tp').textContent=t.desc;
    tEl.style.setProperty('--c',t.c);tEl.classList.remove('swap');},reduce?0:220);
  document.documentElement.style.setProperty('--c',t.c);
  dock.querySelectorAll('.dot').forEach((b,j)=>b.classList.toggle('on',j===i));
  koko.parent&&koko.parent.remove(koko);islands[i].g.children[islands[i].g.children.length-1].add(koko);koko.position.set(2.2,0,1.6);
  if(date)showDate(date);else{const mine=SCHED.filter(s=>taskOf(s.l)===t.id);const nx=mine.find(s=>s.d>=today);showDate(nx?nx.d:null,t);}}
function slot(s){const L=LESSONS[s.l];let dn={};try{dn=JSON.parse(localStorage.getItem('prep-'+s.l)||'{}');}catch(e){}
  return `<div class="slot"><div class="row"><span class="cls ${s.c==='乙班'?'b':''}">${s.c}</span><span class="per">${esc(s.p)}</span></div>
  <div class="ln">${esc(L.name)}</div><button class="start" data-l="${s.l}">▶ 開始這堂課</button>
  <details><summary>提醒・準備・步驟</summary><div class="tip">${esc(L.tip)}</div>
  ${L.prep.length?`<div class="prep">${L.prep.map((p,i)=>`<label class="${dn[i]?'done':''}"><input type="checkbox" data-l="${s.l}" data-i="${i}" ${dn[i]?'checked':''}> ${esc(p)}</label>`).join('')}</div>`:''}
  <div class="steps">${L.steps.map((st,i)=>`<a href="${st[1]}" target="_blank" rel="noopener"><i>${i+1}</i>${esc(st[0])}</a>`).join('')}</div></details></div>`;}
function showDate(d,t){t=t||TASKS[cur];curDate=d;const di=d?dates.indexOf(d):-1;
  let h=`<div class="dh"><button id="dp" ${di<=0&&d?'disabled':''} aria-label="前一堂">‹</button><div class="d">`;
  if(d){const f=fmt(d);h+=`<b>${f.md}</b><span class="${d===today?'today':''}">${f.wd}${d===today?'・今天':d<today?'・已上過':'・下一堂'}</span>`;}
  else h+=`<b>${t.name}</b><span>這座島的課</span>`;
  h+=`</div><button id="dn" ${d&&di>=dates.length-1?'disabled':''} aria-label="下一堂">›</button></div>`;
  if(d){const items=SCHED.filter(s=>s.d===d);h+=items.map(slot).join('');}
  const mine=SCHED.filter(s=>taskOf(s.l)===t.id);
  if(mine.length>1||!d){h+=`<details style="margin-top:14px"><summary>這座島的所有課（${mine.length}）</summary><div class="list">${mine.map(s=>{const f=fmt(s.d);return `<button data-d="${s.d}" class="${s.d<today?'past':''}"><b>${f.md}</b><span>${esc(LESSONS[s.l].name)}</span><em>${s.c}</em></button>`;}).join('')}</div></details>`;}
  if(!mine.length)h+=`<div class="empty">這座島還沒排課，可以先打開教材逛逛。</div>`;
  h+=`<div class="more"><a href="${t.url}">📂 教材首頁</a><a href="https://classtools1020.github.io/light-refract/mv.html">🎵 MV</a></div>`;
  panel.innerHTML=h;
  panel.querySelectorAll('.start').forEach(b=>b.onclick=()=>{const L=LESSONS[b.dataset.l];if(!window.FX){alert('請重新整理再試');return;}FX.flowStart(L.name,L.steps.map(st=>({label:st[0],url:st[1]})));});
  panel.querySelectorAll('.prep input').forEach(cb=>cb.onchange=()=>{const k='prep-'+cb.dataset.l;let o={};try{o=JSON.parse(localStorage.getItem(k)||'{}');}catch(e){}o[cb.dataset.i]=cb.checked;try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}cb.parentElement.classList.toggle('done',cb.checked);});
  panel.querySelectorAll('.list button').forEach(b=>b.onclick=()=>jump(b.dataset.d));
  const dp=document.getElementById('dp'),dn_=document.getElementById('dn');
  dp.onclick=()=>{const j=d?di-1:dates.filter(x=>x<today).length-1;if(j>=0)jump(dates[j]);};
  dn_.onclick=()=>{const j=d?di+1:dates.findIndex(x=>x>=today);if(j>=0&&j<dates.length)jump(dates[j]);};}
function jump(d){const s=SCHED.find(x=>x.d===d);const i=TASKS.findIndex(t=>t.id===taskOf(s.l));go(i,d);}

/* ---------- 開場 ---------- */
resize();
const first=dates.find(d=>d>=today)||dates[dates.length-1];
jump(first);camX=islands[cur].g.position.x-(reduce?0:SP*.6);

/* ---------- 動畫 ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  const gx=islands[cur].g.position.x;camX+=(gx-camX)*(reduce?1:1-Math.pow(.015,dt));
  if(!drag){spinV*=.92;spin+=spinV;if(auto&&!reduce)spin+=dt*.12;}
  const r=innerWidth>820?40:36,el=.26;camera.position.set(camX+Math.sin(-.55)*r*Math.cos(el),1+r*Math.sin(el),Math.cos(-.55)*r*Math.cos(el));
  camera.lookAt(camX,innerWidth>820?2.2:1.2,0);
  key.position.set(camX-14,26,18);key.target.position.set(camX,0,0);rim.position.set(camX+16,10,-14);
  islands.forEach((I,i)=>{I.g.position.y=reduce?0:Math.sin(t*.9+i)*.18;I.g.rotation.y=i===cur?spin*.9-.15:-.15;});
  if(!reduce){koko.position.y=Math.abs(Math.sin(t*2.6))*.18;koko.rotation.y=-.2+Math.sin(t*1.2)*.25;}
  renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
