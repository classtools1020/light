 <stop offset="0%" stop-color="#123a5c"/><stop offset="55%" stop-color="#0a2036"/><stop offset="100%" stop-color="#05101f"/>
</radialGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>

