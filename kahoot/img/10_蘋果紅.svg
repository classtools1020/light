<rect width="1280" height="720" fill="url(#bg)"/>
<rect x="10" y="10" width="1260" height="700" rx="30" fill="none" stroke="rgba(120,170,210,.28)" stroke-width="4"/>
<text x="640" y="80" font-size="52" fill="#ffc93c" text-anchor="middle" font-weight="900">蘋果為什麼是紅色？</text><text x="640" y="132" font-size="34" fill="#9db8cf" text-anchor="middle" font-weight="700">它把紅光反射進眼睛</text><line x1="150" y1="300" x2="480" y2="380" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/><text x="300" y="290" font-size="26" fill="#eaf6ff" font-weight="800" text-anchor="middle">白光照過來</text><g transform="translate(580,430)"><path d="M 0 -80 C 90 -140 170 -60 130 40 C 110 110 40 130 0 100 C -40 130 -110 110 -130 40 C -170 -60 -90 -140 0 -80 Z" fill="#e83b3b" stroke="#a51f1f" stroke-width="8"/><rect x="-8" y="-120" width="16" height="50" rx="6" fill="#6b4a1a"/><path d="M 10 -110 q 60 -20 70 20 q -55 12 -70 -20" fill="#3fae5a"/></g><line x1="700" y1="370" x2="885" y2="305" stroke="#ff5a5a" stroke-width="14" stroke-linecap="round"/><polygon points="900,300 881,317 874,298" fill="#ff5a5a"/><text x="800" y="270" font-size="30" fill="#ff5a5a" text-anchor="middle" font-weight="800">反射紅光</text><g transform="translate(1040,330) scale(1.1)"><ellipse cx="0" cy="0" rx="52" ry="34" fill="#fff" stroke="#0a2036" stroke-width="4"/><circle cx="6" cy="0" r="20" fill="#28324a"/><circle cx="6" cy="0" r="10" fill="#050a12"/><circle cx="0" cy="-6" r="5" fill="#fff"/></g><text x="560" y="640" font-size="26" fill="#9db8cf" text-anchor="middle" font-weight="800">其他顏色的光被吸收，只剩紅光跑出來</text>
</svg>