<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'WenQuanYi Zen Hei','Noto Sans TC',sans-serif">
<defs>
<radialGradient id="bg" cx="50%" cy="8%" r="120%">
 <stop offset="0%" stop-color="#123a5c"/><stop offset="55%" stop-color="#0a2036"/><stop offset="100%" stop-color="#05101f"/>
</radialGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>

</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<rect x="10" y="10" width="1260" height="700" rx="30" fill="none" stroke="rgba(120,170,210,.28)" stroke-width="4"/>
<text x="640" y="80" font-size="52" fill="#ffc93c" text-anchor="middle" font-weight="900">香蕉為什麼是黃色？</text><text x="640" y="132" font-size="34" fill="#9db8cf" text-anchor="middle" font-weight="700">它把黃光反射進眼睛</text><line x1="150" y1="300" x2="480" y2="380" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/><text x="300" y="290" font-size="26" fill="#eaf6ff" font-weight="800" text-anchor="middle">白光照過來</text><g transform="translate(560,420) rotate(-20)"><path d="M -150 40 Q -120 -110 40 -120 Q 20 -60 60 -20 Q -20 90 -150 40 Z" fill="#ffd426" stroke="#e0a800" stroke-width="8"/><path d="M 30 -118 l 14 -26 l 10 6 l -12 24 Z" fill="#6b4a1a"/></g><line x1="640" y1="360" x2="885" y2="304" stroke="#ffd426" stroke-width="14" stroke-linecap="round"/><polygon points="900,300 879,315 874,296" fill="#ffd426"/><text x="790" y="270" font-size="30" fill="#ffd426" text-anchor="middle" font-weight="800">反射黃光</text><g transform="translate(1040,330) scale(1.1)"><ellipse cx="0" cy="0" rx="52" ry="34" fill="#fff" stroke="#0a2036" stroke-width="4"/><circle cx="6" cy="0" r="20" fill="#28324a"/><circle cx="6" cy="0" r="10" fill="#050a12"/><circle cx="0" cy="-6" r="5" fill="#fff"/></g><text x="560" y="640" font-size="26" fill="#9db8cf" text-anchor="middle" font-weight="800">其他顏色的光被吸收，只剩黃光跑出來</text>
</svg>