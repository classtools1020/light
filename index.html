<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<title>光偵探隊｜今天上課點這裡</title>
<style>
  :root{
    --bg1:#05101f; --bg2:#0a2036; --bg3:#0e3350;
    --amber:#ffc93c; --amber2:#ff9f1c; --teal:#42e0c8;
    --ink:#eaf6ff; --dim:#9db8cf; --card:#0f2841; --line:rgba(120,170,210,.28);
    --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, rgba(255,201,60,.10), transparent 55%),
      linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .emblem{font-size:clamp(56px,12vw,90px);filter:drop-shadow(0 8px 18px rgba(255,201,60,.35))}
  .eyebrow{font-size:15px;font-weight:900;letter-spacing:.3em;color:var(--amber);margin-top:6px;text-align:center}
  h1{font-size:clamp(30px,6vw,44px);margin:6px 0 30px;text-align:center}

  .big-btns{display:flex;flex-direction:column;gap:22px;width:100%;max-width:520px}
  .bigbtn{
    display:flex;align-items:center;gap:20px;
    background:linear-gradient(160deg,#123152,#0c2742);
    border:3px solid var(--line);border-radius:28px;
    padding:28px 30px;text-decoration:none;color:var(--ink);
    box-shadow:0 12px 30px var(--shadow);
    transition:transform .12s, border-color .15s;
  }
  .bigbtn:active{transform:scale(.97)}
  .bigbtn.a{border-color:rgba(255,107,107,.55)}
  .bigbtn.b{border-color:rgba(66,224,200,.55)}
  .bigbtn .ic{font-size:56px;line-height:1;flex:none}
  .bigbtn .tx .t{font-size:34px;font-weight:900}
  .bigbtn .tx .d{font-size:16px;color:var(--dim);font-weight:700;margin-top:4px}
  .bigbtn .go{margin-left:auto;font-size:34px;color:var(--amber);flex:none}

  footer{margin-top:36px;font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>
  <div class="emblem">🕵️</div>
  <div class="eyebrow">光偵探隊　今天上課</div>
  <h1>點你的班級，直接開始</h1>

  <div class="big-btns">
    <a class="bigbtn a" href="01-phenomena/case-file.html">
      <div class="ic">🅰️</div>
      <div class="tx"><div class="t">甲班</div><div class="d">光的現象（影子・反射・折射）</div></div>
      <div class="go">▶</div>
    </a>
    <a class="bigbtn b" href="01-phenomena/case-file.html">
      <div class="ic">🅱️</div>
      <div class="tx"><div class="t">乙班</div><div class="d">先上光的現象，第二堂再點下一步</div></div>
      <div class="go">▶</div>
    </a>
  </div>

  <footer>🕵️ 光偵探隊　｜　自然科　｜　點下去就對了，不用想</footer>
</body></html>
