<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光的世界｜自然科互動教材</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--bg:#0E0B1A;--panel:#1E183C;--panel2:#271F4E;--ink:#F6F2FF;--soft:#B7ADDD;--beam:#FFC53D;--line:#3A2F63;--go:#37D67A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 50% -10%,#221a44,var(--bg) 60%);
  color:var(--ink);font-family:"Noto Sans TC","Baloo 2",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:clamp(24px,5vw,60px) 18px}
.bulb{font-size:clamp(46px,9vw,72px);filter:drop-shadow(0 0 22px var(--beam))}
h1{font-size:clamp(38px,8vw,68px);font-weight:900;margin:.1em 0;text-align:center;text-wrap:balance}
h1 .hl{color:var(--beam);text-shadow:0 0 26px rgba(255,197,61,.5)}
.tag{color:var(--soft);font-size:clamp(15px,3vw,20px);margin:.2em 0 clamp(24px,5vw,44px);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(14px,2.4vw,22px);width:min(920px,100%)}
.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:3px solid var(--line);
  border-radius:24px;padding:clamp(20px,3vw,30px);box-shadow:0 18px 40px rgba(0,0,0,.5);
  transition:transform .15s,border-color .2s}
.card:hover{transform:translateY(-6px);border-color:var(--beam)}
.card.soon{opacity:.5;pointer-events:none}
.num{display:inline-block;font-size:14px;font-weight:800;color:#2a1c00;background:var(--beam);
  padding:4px 12px;border-radius:999px;margin-bottom:12px}
.card h2{font-size:clamp(24px,4vw,30px);font-weight:900;margin:.1em 0}
.card p{color:var(--soft);font-size:15px;margin:.3em 0 0;font-weight:500}
.card .em{font-size:44px;line-height:1;margin-bottom:6px}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:800;color:var(--beam)}
.foot{margin-top:auto;padding-top:36px;color:var(--soft);font-size:13px;text-align:center}
</style>
</head>
<body>
  <div class="bulb">💡</div>
  <h1>光的<span class="hl">世界</span></h1>
  <p class="tag">自然科 · 翰林八上第四章　🚂 跟著小火車一起探險</p>
  <div class="grid">
    <a class="card" href="01-phenomena/">
      <div class="em">🌑🪞💧</div>
      <span class="num">第 1 節</span>
      <h2>光的現象</h2>
      <p>影子・反射・折射　簡報＋遊戲＋教案＋學習單</p>
      <span class="go">查看全部 →</span>
    </a>
    <a class="card" href="02-color/">
      <div class="em">🔴🟢🔵</div>
      <span class="num">第 2 節</span>
      <h2>光與顏色</h2>
      <p>三原色・混光・彩虹　簡報＋遊戲＋教案＋學習單</p>
      <span class="go">查看全部 →</span>
    </a>
    <div class="card soon">
      <div class="em">🔍</div>
      <span class="num">第 3 節</span>
      <h2>光學產品</h2>
      <p>放大鏡・眼鏡・照相機　（製作中）</p>
    </div>
  </div>
  <div class="foot">大圖少字 · 有聲音 · 中英雙語 · 三層次差異化</div>
</body>
</html>
